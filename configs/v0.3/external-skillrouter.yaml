schema_version: v0.3.external-skillrouter.placeholder
seed: 20260625
status: FILL_BEFORE_RUN

benchmark:
  id: skillrouter
  data_root: "${SKILLROUTER_DATA_ROOT:-FILL_BEFORE_RUN}"
  upstream_repo: zhengyanzhao1997/SkillRouter
  upstream_ref: FILL_BEFORE_RUN
  license_note: FILL_BEFORE_RUN
  tiers:
    - easy
    - hard
  skip_task_types:
    - generic_only

routers:
  - id: baseline-minilm
    role: baseline
    checkpoint: FILL_BEFORE_RUN
    threshold: FILL_BEFORE_RUN
    top_k: 50
    text_builder: FILL_BEFORE_RUN
  - id: finetuned-embedding
    role: diagnostic_candidate
    checkpoint: FILL_BEFORE_RUN
    threshold: FILL_BEFORE_RUN
    top_k: 50
    text_builder: FILL_BEFORE_RUN

field_views:
  - name_only
  - metadata
  - full_body

official_protocol:
  retrieval_top_k: 50
  rerank_top_k: 20
  metrics:
    - ndcg_at_1
    - ndcg_at_3
    - ndcg_at_10
    - hit_at_1
    - precision_at_3
    - mrr_at_10
    - recall_at_10
    - recall_at_20
    - recall_at_50
    - full_coverage_at_3
