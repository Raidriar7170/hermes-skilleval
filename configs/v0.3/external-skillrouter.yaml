  official_full_pool: true
  hermes_stress_sizes:
    - 1000
    - 10000
    - full
  sampling_seed: 20260625

scored_set_policy:
  usage: evaluation_only
  forbid_training: true
  forbid_threshold_tuning: true
  forbid_variant_selection: true
  forbid_hard_negative_mining: true

outputs:
  run_id: FILL_BEFORE_RUN
  artifact_root: "artifacts/v0.3/{run_id}"
  official_metrics: "metrics/official.json"
  hermes_diagnostics: "metrics/hermes-diagnostics.json"
  leakage_report: "leakage/report.json"
  manifest: "manifest.json"
