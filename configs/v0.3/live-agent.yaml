# Hermes SkillEval v0.3 live-agent placeholder config.
# This file is a template only. It is not executable evidence.

schema_version: v0.3.live-agent.placeholder
seed: 20260625
status: FILL_BEFORE_RUN

runtime:
  contract: live-agent.v1
  agent_binary: "${HERMES_LIVE_AGENT_BINARY:-FILL_BEFORE_RUN}"
  agent_model: "${HERMES_LIVE_AGENT_MODEL:-FILL_BEFORE_RUN}"
  agent_version: FILL_BEFORE_RUN
  sandbox: workspace-write
  approval_policy: never
  timeout_seconds: 1200
  retry_policy: no_retry_for_final_matrix
  deterministic_seed_support: UNAVAILABLE
  deterministic_seed_reason: verify live-agent backend support before final run
  codex_home_mode: isolated

task_selection:
  source: SkillsBench
  upstream_repo: benchflow-ai/skillsbench
  upstream_ref: FILL_BEFORE_RUN
  task_ids: FILL_BEFORE_RUN
  require_no_external_credentials: true
  require_network_free: true
  require_oracle_pass: true
  require_deterministic_verifier: true
  overlap_with_skillrouter_queries: REVIEW_BEFORE_RUN

registry:
  manifest: FILL_BEFORE_RUN
  router_top_k: 3
  hide_source_task_id: true

conditions:
  - no-skill
  - routed-skill
  - oracle-skill

trials_per_condition: 3

judging:
  primary_success_judge: deterministic_verifier
  llm_judge_allowed: diagnostic_only
  human_review_allowed: diagnostic_only

retention:
  raw_traces_in_git: false
  stdout_stderr_in_git: redacted_summary_only
  credentials_in_git: false
  artifact_root: "artifacts/v0.3/FILL_BEFORE_RUN/live-agent"

outputs:
  manifest: "manifest.json"
  verifier_results: "live-agent/verifier-results.jsonl"
  summary: "live-agent/summary.json"
  redacted_report: "report.md"
