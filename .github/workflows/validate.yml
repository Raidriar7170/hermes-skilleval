name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lightweight-tests:
    name: Lightweight pytest and release gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Run lightweight test suite
        id: pytest
        continue-on-error: true
        run: pytest -q

      - name: Run OpenSpec validation
        id: openspec_validate
        continue-on-error: true
        run: OPENSPEC_TELEMETRY=0 openspec validate --all --strict

      - name: Run release reproducibility gate
        id: release_check
        continue-on-error: true
        run: |
          skilleval release-check \
            --phase17-output-dir docs/demo/phase17-calibrated-release-selector \
            --release-output-dir docs/demo/phase18-ci-release-reproducibility
          git diff --exit-code \
            docs/demo/phase17-calibrated-release-selector \
            docs/demo/phase18-ci-release-reproducibility

      - name: Run diagnostic demo CI gate
        id: diagnostic_gate
        continue-on-error: true
        run: |
          skilleval diagnostic-ci-gate \
            --scan docs/demo/diagnostic-onboarding/scan.json \
            --lint docs/demo/diagnostic-onboarding/lint.json \
            --inspect docs/demo/diagnostic-onboarding/inspect.json \
            --route docs/demo/diagnostic-onboarding/route-browser-smoke.json \
            --route docs/demo/diagnostic-onboarding/route-debug-red-green.json \
            --output "$RUNNER_TEMP/diagnostic-ci-gate-report.json" \
            --markdown-output "$RUNNER_TEMP/diagnostic-ci-gate-report.md" \
            --max-lint-findings 5 \
            --max-conflict-clusters 4 \
            --max-route-risk-flags 15 \
            --min-route-candidates 3

      - name: Run diagnostic artifact drift check
        id: diagnostic_drift
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/diagnostic-onboarding"
          mkdir -p "$RUNNER_TEMP/diagnostic-onboarding"

          skilleval scan \
            docs/demo/diagnostic-onboarding/source/skills \
            --output "$RUNNER_TEMP/diagnostic-onboarding/scan.json"

          skilleval lint \
            --index "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --output "$RUNNER_TEMP/diagnostic-onboarding/lint.json"

          skilleval inspect \
            --index "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --output "$RUNNER_TEMP/diagnostic-onboarding/inspect.json"

          skilleval route \
            "smoke test a local browser page and check console errors" \
            --index "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --inspect "$RUNNER_TEMP/diagnostic-onboarding/inspect.json" \
            --top-k 3 \
            --output "$RUNNER_TEMP/diagnostic-onboarding/route-browser-smoke.json"

          skilleval route \
            "debug failing tests with a red-green loop" \
            --index "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --inspect "$RUNNER_TEMP/diagnostic-onboarding/inspect.json" \
            --top-k 3 \
            --output "$RUNNER_TEMP/diagnostic-onboarding/route-debug-red-green.json"

          skilleval diagnostic-dashboard \
            --scan "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --lint "$RUNNER_TEMP/diagnostic-onboarding/lint.json" \
            --inspect "$RUNNER_TEMP/diagnostic-onboarding/inspect.json" \
            --route "$RUNNER_TEMP/diagnostic-onboarding/route-browser-smoke.json" \
            --route "$RUNNER_TEMP/diagnostic-onboarding/route-debug-red-green.json" \
            --output "$RUNNER_TEMP/diagnostic-onboarding/dashboard.html"

          skilleval diagnostic-ci-gate \
            --scan "$RUNNER_TEMP/diagnostic-onboarding/scan.json" \
            --lint "$RUNNER_TEMP/diagnostic-onboarding/lint.json" \
            --inspect "$RUNNER_TEMP/diagnostic-onboarding/inspect.json" \
            --route "$RUNNER_TEMP/diagnostic-onboarding/route-browser-smoke.json" \
            --route "$RUNNER_TEMP/diagnostic-onboarding/route-debug-red-green.json" \
            --output "$RUNNER_TEMP/diagnostic-onboarding/ci-gate-report.json" \
            --markdown-output "$RUNNER_TEMP/diagnostic-onboarding/ci-gate-report.md" \
            --max-lint-findings 5 \
            --max-conflict-clusters 4 \
            --max-route-risk-flags 15 \
            --min-route-candidates 3

          skilleval diagnostic-pr-review-surface \
            --gate-report "$RUNNER_TEMP/diagnostic-onboarding/ci-gate-report.json" \
            --output "$RUNNER_TEMP/diagnostic-onboarding/pr-review-packet.json" \
            --markdown-output "$RUNNER_TEMP/diagnostic-onboarding/pr-review-packet.md"

          skilleval diagnostic-artifact-drift-check \
            --expected docs/demo/diagnostic-onboarding \
            --actual "$RUNNER_TEMP/diagnostic-onboarding" \
            --output "$RUNNER_TEMP/diagnostic-artifact-drift.json" \
            --markdown-output "$RUNNER_TEMP/diagnostic-artifact-drift.md"

      - name: Run external skill library validation pack
        id: external_pack
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/external-skill-library-validation"
          mkdir -p \
            "$RUNNER_TEMP/external-skill-library-validation/markdown-skills" \
            "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema"

          skilleval scan \
            docs/demo/external-skill-library-validation/source/markdown-skills \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json"

          skilleval lint \
            --index "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/lint.json"

          skilleval inspect \
            --index "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/inspect.json"

          skilleval route \
            "review release notes for evidence boundaries and non-goals" \
            --index "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/inspect.json" \
            --top-k 2 \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-release-note-review.json"

          skilleval route \
            "audit validation workflow evidence before a maintainer review" \
            --index "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/inspect.json" \
            --top-k 2 \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-workflow-evidence.json"

          skilleval diagnostic-dashboard \
            --scan "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --lint "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/lint.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/inspect.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-release-note-review.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-workflow-evidence.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/dashboard.html"

          skilleval diagnostic-ci-gate \
            --scan "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/scan.json" \
            --lint "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/lint.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/inspect.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-release-note-review.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/route-workflow-evidence.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/ci-gate-report.json" \
            --markdown-output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/ci-gate-report.md" \
            --max-lint-findings 4 \
            --max-conflict-clusters 4 \
            --max-route-risk-flags 20 \
            --min-route-candidates 2

          skilleval diagnostic-pr-review-surface \
            --gate-report "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/ci-gate-report.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/pr-review-packet.json" \
            --markdown-output "$RUNNER_TEMP/external-skill-library-validation/markdown-skills/pr-review-packet.md"

          skilleval scan \
            docs/demo/external-skill-library-validation/source/mcp-tool-schema/tools.json \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json"

          skilleval lint \
            --index "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/lint.json"

          skilleval inspect \
            --index "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/inspect.json"

          skilleval route \
            "capture browser console diagnostics for a local maintainer page" \
            --index "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/inspect.json" \
            --top-k 2 \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-browser-console.json"

          skilleval route \
            "inspect semantic artifact drift between expected and regenerated reports" \
            --index "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/inspect.json" \
            --top-k 2 \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-artifact-drift.json"

          skilleval diagnostic-dashboard \
            --scan "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --lint "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/lint.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/inspect.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-browser-console.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-artifact-drift.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/dashboard.html"

          skilleval diagnostic-ci-gate \
            --scan "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/scan.json" \
            --lint "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/lint.json" \
            --inspect "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/inspect.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-browser-console.json" \
            --route "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/route-artifact-drift.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/ci-gate-report.json" \
            --markdown-output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/ci-gate-report.md" \
            --max-lint-findings 4 \
            --max-conflict-clusters 4 \
            --max-route-risk-flags 20 \
            --min-route-candidates 2

          skilleval diagnostic-pr-review-surface \
            --gate-report "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/ci-gate-report.json" \
            --output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/pr-review-packet.json" \
            --markdown-output "$RUNNER_TEMP/external-skill-library-validation/mcp-tool-schema/pr-review-packet.md"

          skilleval diagnostic-artifact-drift-check \
            --expected docs/demo/external-skill-library-validation \
            --actual "$RUNNER_TEMP/external-skill-library-validation" \
            --output "$RUNNER_TEMP/external-skill-library-validation-drift.json" \
            --markdown-output "$RUNNER_TEMP/external-skill-library-validation-drift.md"

      - name: Collect changed files
        if: always()
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_SHA="$(git rev-parse HEAD^)"
          else
            BASE_SHA=""
          fi

          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git ls-files > "$RUNNER_TEMP/changed-files.txt"
          fi

      - name: Write PR-facing CI summary
        if: always()
        id: ci_summary
        continue-on-error: true
        run: |
          skilleval ci-summary \
            --check pytest=${{ steps.pytest.outcome }} \
            --check openspec-validate=${{ steps.openspec_validate.outcome }} \
            --check release-check=${{ steps.release_check.outcome }} \
            --check diagnostic-gate=${{ steps.diagnostic_gate.outcome }} \
            --check diagnostic-drift=${{ steps.diagnostic_drift.outcome }} \
            --check external-pack=${{ steps.external_pack.outcome }} \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --release-check docs/demo/phase18-ci-release-reproducibility/release-check-summary.json \
            --diagnostic-gate "$RUNNER_TEMP/diagnostic-ci-gate-report.json" \
            --diagnostic-drift "$RUNNER_TEMP/diagnostic-artifact-drift.json" \
            --overclaim-root README.md \
            --overclaim-root docs/usage.md \
            --output "$RUNNER_TEMP/ci-summary.json" \
            --markdown-output "$RUNNER_TEMP/ci-summary.md" || true
          cat "$RUNNER_TEMP/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ${{ runner.temp }}/ci-summary.json
            ${{ runner.temp }}/ci-summary.md
            ${{ runner.temp }}/diagnostic-ci-gate-report.json
            ${{ runner.temp }}/diagnostic-ci-gate-report.md
            ${{ runner.temp }}/diagnostic-artifact-drift.json
            ${{ runner.temp }}/diagnostic-artifact-drift.md
            ${{ runner.temp }}/diagnostic-onboarding
            ${{ runner.temp }}/external-skill-library-validation
            ${{ runner.temp }}/external-skill-library-validation-drift.json
            ${{ runner.temp }}/external-skill-library-validation-drift.md

      - name: Enforce CI summary decision
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["RUNNER_TEMP"]) / "ci-summary.json"
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          decision = summary["decision"]
          print(f"CI summary decision: {decision}")
          if decision == "BLOCK_MERGE":
              raise SystemExit(1)
          if decision != "ALLOW_MERGE":
              raise SystemExit(f"Unexpected CI summary decision: {decision}")
          PY
